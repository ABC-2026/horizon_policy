# Run with:
# docker compose -f scripts/docker/compose.yml up --build

services:
  openpi_server:
    image: openpi_server
    build:
      context: ../..
      dockerfile: scripts/docker/serve_policy.Dockerfile
    init: true
    tty: true
    network_mode: host

    volumes:
      - ../..:/app
      - ${OPENPI_DATA_HOME:-~/.cache/openpi}:/openpi_assets

    environment:
      - SERVER_ARGS
      - OPENPI_DATA_HOME=/openpi_assets
      - IS_DOCKER=true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]